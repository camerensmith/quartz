[project]
name = "quartz"
version = "2.6.3"
description = "Personal Database Desktop Application - A modern, extensible alternative to Symphytum"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Quartz Contributors"}
]
keywords = ["database", "desktop", "personal", "data-management"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

dependencies = [
    "PySide6>=6.5.0",
    "jsonschema>=4.17.0",
    "lark>=1.1.0",
    # "pandas>=2.0.0",  # REMOVED - replaced with csv module and openpyxl
    "python-dateutil>=2.8.0",
    "Pillow>=10.0.0",
    "openpyxl>=3.1.0",  # Added explicitly for Excel support
    "typing-extensions>=4.5.0",
    "pydantic>=2.0.0",
    "sqlparse>=0.4.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-qt>=4.2.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "PyInstaller>=5.13.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/quartz"
Repository = "https://github.com/yourusername/quartz"
Issues = "https://github.com/yourusername/quartz/issues"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src --cov-report=html --cov-report=term"

