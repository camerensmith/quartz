name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.5.0)'
        required: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install "pyinstaller>=6.0.0"

      - name: Build executable with PyInstaller
        run: |
          pyinstaller quartz.spec --clean --noconfirm

      - name: Rename executable with version tag
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ github.event.inputs.tag }}"
          } else {
            "${{ github.ref_name }}"
          }
          $version = $tag -replace '^v', ''
          $src  = "dist\Quartz.exe"
          $dest = "dist\Quartz-windows-$version.exe"
          Rename-Item -Path $src -NewName (Split-Path $dest -Leaf)
          Write-Output "RELEASE_TAG=$tag"           >> $env:GITHUB_ENV
          Write-Output "RELEASE_VERSION=$version"   >> $env:GITHUB_ENV
          Write-Output "EXE_PATH=$dest"             >> $env:GITHUB_ENV

      - name: Check tag matches project version
        shell: pwsh
        run: |
          # The app compares its own version against the latest release, so they must agree
          $projectVersion = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ($projectVersion -ne $env:RELEASE_VERSION) {
            Write-Error "Tag version $env:RELEASE_VERSION does not match pyproject.toml version $projectVersion"
            exit 1
          }

      - name: Prepare release notes
        shell: pwsh
        run: |
          # Hand-written notes for this version, if any, go above GitHub's generated PR list
          $notes = ".github/release-notes/$env:RELEASE_VERSION.md"
          if (Test-Path $notes) {
            Copy-Item $notes release-body.md
          } else {
            New-Item release-body.md -ItemType File | Out-Null
          }

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: quartz-windows-exe
          path: ${{ env.EXE_PATH }}
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Quartz ${{ env.RELEASE_VERSION }}
          draft: false
          prerelease: false
          files: ${{ env.EXE_PATH }}
          body_path: release-body.md
          generate_release_notes: true
